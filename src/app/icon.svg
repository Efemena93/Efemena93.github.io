<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Two signals and the thread between them: the site's whole idea, at 16px.
       SVG rather than .ico so the favicon is a text file like everything else
       in this repo, and so it stays sharp at any size. -->
  <rect width="32" height="32" rx="6" fill="#f6f2ea"/>
  <line x1="11" y1="20" x2="21" y2="12" stroke="#7b93a8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="11" cy="20" r="4" fill="#7e9585"/>
  <circle cx="21" cy="12" r="2.5" fill="#c08a6a"/>
</svg>
