# Check every pull request, and every branch push other than main, before it
# can reach the live site. Deploys stay in deploy.yml and only run on main.

name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check types and lint
        run: npm run check

      - name: Build static site
        run: npm run build
